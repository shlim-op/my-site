<html lang="ko">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg-1: #fef6ec;
    --bg-2: #e9f2ff;
    --ink: #1a202c;
    --ink-soft: #4a5568;
    --ink-mute: #718096;
    --line: #e2e8f0;
    --card: #ffffff;
    --brand: #2b6cb0;
    --brand-soft: #ebf4ff;
    --accent: #dd6b20;
    --accent-soft: #fffaf0;
    --good: #38a169;
    --shadow: 0 24px 64px rgba(15, 23, 42, 0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: 24px 16px 48px;
    min-height: 100%;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 6px;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .brand {
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.2px;
  }
  .brand .dot { color: var(--brand); }

  .card {
    background: var(--card);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 28px;
  }

  h1.title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.6px;
    margin-bottom: 8px;
  }
  h2.title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    margin-bottom: 6px;
  }
  .lede {
    color: var(--ink-soft);
    font-size: 15px;
    margin-bottom: 22px;
  }

  /* Welcome */
  .hero-emoji {
    font-size: 48px;
    margin-bottom: 8px;
  }
  .perks {
    list-style: none;
    margin: 18px 0 24px;
    display: grid;
    gap: 10px;
  }
  .perks li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .perks li::before {
    content: "✓";
    color: var(--good);
    font-weight: 700;
    margin-top: 1px;
  }

  .primary {
    width: 100%;
    padding: 16px 20px;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    font-family: inherit;
  }
  .primary:hover { opacity: 0.92; }
  .primary:active { transform: scale(0.98); }
  .primary.brand { background: var(--brand); }

  .ghost {
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .ghost:hover { border-color: var(--ink-soft); color: var(--ink); }

  /* Quiz */
  .progress {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }
  .progress .seg {
    flex: 1;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress .seg.on { background: var(--brand); }

  .step-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--brand);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .options {
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }
  .options.two-col { grid-template-columns: 1fr 1fr; }

  .option {
    text-align: left;
    background: white;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    transition: all 0.15s;
  }
  .option:hover {
    border-color: var(--brand);
    background: var(--brand-soft);
  }
  .option .icon {
    font-size: 22px;
    flex-shrink: 0;
  }
  .option .opt-text {
    flex: 1;
    font-weight: 600;
  }
  .option .opt-sub {
    display: block;
    font-weight: 400;
    font-size: 12px;
    color: var(--ink-mute);
    margin-top: 2px;
  }

  .quiz-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }

  /* Loading */
  .loading-wrap {
    text-align: center;
    padding: 36px 0 28px;
  }
  .spinner {
    width: 56px; height: 56px;
    border: 4px solid var(--line);
    border-top-color: var(--brand);
    border-radius: 50%;
    margin: 0 auto 18px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-weight: 600;
    color: var(--ink-soft);
  }

  /* Result */
  .persona-card {
    background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
    color: white;
    padding: 22px;
    border-radius: 16px;
    margin-bottom: 18px;
  }
  .persona-eyebrow {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 6px;
  }
  .persona-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.4px;
    margin-bottom: 6px;
  }
  .persona-desc {
    font-size: 14px;
    opacity: 0.92;
    line-height: 1.6;
  }

  .section-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin: 22px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .dest-list { display: grid; gap: 8px; }
  .dest-item {
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    background: white;
    transition: all 0.15s;
    text-align: left;
    width: 100%;
    font-family: inherit;
    color: var(--ink);
  }
  .dest-item:hover { border-color: var(--brand); }
  .dest-item.active {
    border-color: var(--brand);
    background: var(--brand-soft);
  }
  .dest-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .dest-emoji { font-size: 22px; }
  .dest-name { font-weight: 700; font-size: 16px; }
  .dest-country { color: var(--ink-mute); font-size: 12px; margin-left: auto; }
  .dest-rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 800;
  }
  .dest-rank.r2 { background: #a0aec0; }
  .dest-rank.r3 { background: #cd7f32; }
  .dest-score {
    color: var(--brand);
    font-weight: 700;
    font-size: 13px;
    margin-left: 6px;
  }
  .dest-reason {
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.55;
  }

  .detail-card {
    background: var(--accent-soft);
    border-radius: 16px;
    padding: 20px;
    margin-top: 18px;
  }
  .detail-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .detail-name {
    font-size: 20px;
    font-weight: 800;
  }
  .detail-country {
    color: var(--ink-mute);
    font-size: 13px;
  }
  .detail-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tag {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: white;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid #fbd38d;
  }

  .detail-block { margin-top: 14px; }
  .detail-block h4 {
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-soft);
    letter-spacing: 0.4px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .detail-block ul {
    list-style: none;
    display: grid;
    gap: 4px;
  }
  .detail-block li {
    font-size: 14px;
    color: var(--ink);
    padding-left: 14px;
    position: relative;
    line-height: 1.55;
  }
  .detail-block li::before {
    content: "·";
    position: absolute;
    left: 4px;
    font-weight: 800;
    color: var(--accent);
  }
  .detail-block .budget {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }

  .result-actions {
    display: flex;
    gap: 8px;
    margin-top: 22px;
  }

  .footer-note {
    text-align: center;
    color: var(--ink-mute);
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>

        'Day 3 — 시부야 + 하라주쿠 + 오모테산도 카페',
        'Day 4 — 디즈니씨 또는 하코네 당일치기',
        'Day 5 — 츠키지 시장 → 공항',
      ],
      budgetEstimate: '4박5일 1인 130~200만원',
      prep: ['여권(6개월+)', 'JR Pass 또는 Suica 충전', '환전 + 해외결제 카드', '편한 신발(많이 걷는다)'],
      tips: [
        '인기 식당은 Tablecheck/Tabelog로 사전 예약',
        '구글맵 환승 안내 그대로 따라가면 됨',
        '면세는 합산 5,000엔 이상 + 같은 매장 같은 날',
      ],
    },
    {
      id: 'paris', name: '파리', country: '프랑스', emoji: '🗼',
      tags: ['문화', '도시', '미식'],
      budget: 4, language: 2, adventure: 2,
      seasonScore: { spring: 5, summer: 4, autumn: 4, winter: 3 },
      companionFit: { solo: 4, couple: 5, family: 3, friends: 4 },
      styleFit: { resort: 2, city: 5, nature: 2, culture: 5 },
      oneLineReason: '미술관·카페·골목·빵. 도시 그 자체가 컨텐츠인 곳.',
      course: [
        'Day 1 — 도착 → 마레지구 산책 → 비스트로 저녁',
        'Day 2 — 루브르(반나절) + 오랑주리',
        'Day 3 — 베르사유 당일치기',
        'Day 4 — 오르세 + 몽마르트르 일몰',
        'Day 5 — 에펠탑 + 마카롱 쇼핑 → 공항',
      ],
      budgetEstimate: '4박5일 1인 220~350만원',
      prep: ['여권(6개월+)', 'ETIAS 시행 시 사전 신청', '여행자 보험(필수)', '유로 환전', '소매치기 방지 가방'],
      tips: [
        '루브르·오르세·베르사유는 무조건 사전 온라인 예약',
        '메트로에서 가방은 앞으로, 휴대폰 들고 걸으며 보지 말기',
        '점심은 "Formule" 코스가 가성비 최고',
      ],
    },
  ];

  const questions = [
    {
      key: 'companion',
      title: '누구와 함께 떠나시나요?',
      sub: '동행에 따라 적합한 동선이 크게 달라집니다.',
      options: [
        { value: 'solo', label: '혼자', icon: '🧍', sub: '내 페이스대로' },
        { value: 'couple', label: '연인 / 배우자', icon: '💑', sub: '둘만의 시간' },
        { value: 'family', label: '가족 (아이 동반)', icon: '👨‍👩‍👧', sub: '안전·편의 우선' },
        { value: 'friends', label: '친구들', icon: '🧑‍🤝‍🧑', sub: '활기차게' },
      ],
    },
    {
      key: 'style',
      title: '어떤 여행을 원하시나요?',
      sub: '가장 끌리는 한 가지를 골라주세요.',
      options: [
        { value: 'resort', label: '휴양 · 아무것도 안 하기', icon: '🏖️' },
        { value: 'city', label: '도시 탐험 · 쇼핑 · 야경', icon: '🌃' },
        { value: 'nature', label: '자연 · 액티비티 · 트레킹', icon: '🏔️' },
        { value: 'culture', label: '문화 · 미식 · 박물관', icon: '🏛️' },
      ],
    },
    {
      key: 'budget',
      title: '1인 예산(항공권 포함)은 어느 정도인가요?',
      sub: '4~5일 기준입니다.',
      options: [
        { value: 1, label: '80만원 이하', icon: '🪙', sub: '국내 또는 가성비 동남아' },
        { value: 2, label: '80~150만원', icon: '💴', sub: '근거리 해외' },
        { value: 3, label: '150~300만원', icon: '💳', sub: '동남아 풀빌라 / 일본' },
        { value: 4, label: '300만원 이상', icon: '✨', sub: '유럽 · 프리미엄' },
      ],
    },
    {
      key: 'season',
      title: '언제 떠나실 예정인가요?',
      sub: '계절에 따라 추천이 달라집니다.',
      options: [
        { value: 'spring', label: '봄 (3~5월)', icon: '🌸' },
        { value: 'summer', label: '여름 (6~8월)', icon: '☀️' },
        { value: 'autumn', label: '가을 (9~11월)', icon: '🍂' },
        { value: 'winter', label: '겨울 (12~2월)', icon: '❄️' },
      ],
    },
    {
      key: 'language',
      title: '외국어 자신감은 어느 정도인가요?',
      sub: '솔직하게 골라주세요. 추천이 더 정확해집니다.',
      options: [
        { value: 1, label: '영어 어려움', icon: '🤐', sub: '한국어·번역기 위주' },
        { value: 2, label: '생활 영어 OK', icon: '🙂', sub: '주문·길묻기 가능' },
        { value: 3, label: '영어 자신 있음', icon: '😎', sub: '대화 가능' },
      ],
    },
    {
      key: 'adventure',
      title: '얼마나 새로운 곳을 원하시나요?',
      sub: '여행 강도와 즉흥성을 가늠하는 질문입니다.',
      options: [
        { value: 1, label: '익숙하고 안전한 곳', icon: '🛡️', sub: '인프라 잘 갖춰진 곳' },
        { value: 2, label: '적당히 새로운 곳', icon: '🧭', sub: '계획 + 약간의 즉흥' },
        { value: 3, label: '완전 새로운 곳', icon: '🌋', sub: '한국인 적은 곳도 OK' },
      ],
    },
  ];

  // -------- State --------
  const state = {
    screen: 'welcome',
    step: 0,
    answers: {},
    results: [],
    selectedId: null,
  };

  // -------- Scoring --------
  function scoreDestination(d, a) {
    let s = 0;
    // Budget (0~30): exact match = 30, off-by-N reduces
    s += Math.max(0, 30 - Math.abs(d.budget - a.budget) * 10);
    // Season fit (0~25): seasonScore is 1~5
    s += d.seasonScore[a.season] * 5;
    // Companion fit (0~20)
    s += d.companionFit[a.companion] * 4;
    // Style fit (0~25)
    s += d.styleFit[a.style] * 5;
    // Language comfort (0~15): closer = better
    s += Math.max(0, 15 - Math.abs(d.language - a.language) * 6);
    // Adventure (0~15)
    s += Math.max(0, 15 - Math.abs(d.adventure - a.adventure) * 6);
    return s;
  }

  function computeResults() {
    const scored = destinations.map(d => ({
      ...d,
      score: scoreDestination(d, state.answers),
    }));
    scored.sort((x, y) => y.score - x.score);
    // Normalize the displayed score to a 100-scale fit %
    const max = scored[0].score;
    return scored.slice(0, 3).map(d => ({
      ...d,
      fit: Math.round(Math.min(100, (d.score / 130) * 100)),
    }));
  }

  // -------- Persona --------
  const styleLabel = { resort: '휴양', city: '도시 탐험', nature: '자연', culture: '문화·미식' };
  const budgetLabel = { 1: '가성비', 2: '실속', 3: '편안한', 4: '프리미엄' };
  const advAdj = { 1: '안정형', 2: '균형형', 3: '모험형' };
  function buildPersona(a) {
    const name = `${budgetLabel[a.budget]} ${styleLabel[a.style]} ${advAdj[a.adventure]}`;
    const desc = `당신은 ${budgetLabel[a.budget]} 예산 안에서 ${styleLabel[a.style]} 중심의 여행을 좋아하는 ${advAdj[a.adventure]} 여행자입니다. 아래 처방은 동행, 시기, 외국어 자신감까지 함께 고려한 결과예요.`;
    return { name, desc };
  }

  // -------- Render --------
  const app = document.getElementById('app');

  function el(tag, opts = {}, ...children) {
    const e = document.createElement(tag);
    if (opts.class) e.className = opts.class;
    if (opts.text != null) e.textContent = opts.text;
    if (opts.html != null) e.innerHTML = opts.html;
    if (opts.attrs) for (const k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
    if (opts.on) for (const ev in opts.on) e.addEventListener(ev, opts.on[ev]);
    for (const c of children) if (c) e.appendChild(c);
    return e;
  }

  function brandRow() {
    return el('div', { class: 'brand-row' },
      el('div', { class: 'brand', html: '<span class="dot">●</span> 여행 컨설팅' }),
      el('div', { text: '당신만의 여행 처방전' }),
    );
  }

  function render() {
    app.innerHTML = '';
    app.appendChild(brandRow());
    const card = el('div', { class: 'card' });
    app.appendChild(card);
    if (state.screen === 'welcome') renderWelcome(card);
    else if (state.screen === 'quiz') renderQuiz(card);
    else if (state.screen === 'loading') renderLoading(card);
    else if (state.screen === 'result') renderResult(card);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderWelcome(c) {
    c.appendChild(el('div', { class: 'hero-emoji', text: '🧭' }));
    c.appendChild(el('h1', { class: 'title', text: '당신만의 여행 처방전, 1분 만에' }));
    c.appendChild(el('p', { class: 'lede', text: '6개 질문으로 여행 성향을 진단하고, 어울리는 여행지 TOP 3와 코스·예산·준비물·현지 팁까지 한 장의 리포트로 받아보세요.' }));
    const perks = el('ul', { class: 'perks' });
    [
      '여행 스타일·예산·외국어·시기 종합 점수',
      '여행지별 일정·예산·준비물 자동 생성',
      '현지에서 진짜 필요한 팁 3가지',
    ].forEach(t => perks.appendChild(el('li', { text: t })));
    c.appendChild(perks);
    c.appendChild(el('button', {
      class: 'primary brand',
      text: '진단 시작하기 →',
      on: { click: () => { state.screen = 'quiz'; state.step = 0; render(); } },
    }));
    c.appendChild(el('p', { class: 'footer-note', text: '익명 · 데이터 저장 안 함' }));
  }

  function renderQuiz(c) {
    const q = questions[state.step];

    // Progress
    const prog = el('div', { class: 'progress' });
    for (let i = 0; i < questions.length; i++) {
      prog.appendChild(el('div', { class: 'seg' + (i <= state.step ? ' on' : '') }));
    }
    c.appendChild(prog);

    c.appendChild(el('div', { class: 'step-label', text: `STEP ${state.step + 1} / ${questions.length}` }));
    c.appendChild(el('h2', { class: 'title', text: q.title }));
    c.appendChild(el('p', { class: 'lede', text: q.sub }));

    const opts = el('div', { class: 'options' + (q.options.length === 4 ? ' two-col' : '') });
    for (const opt of q.options) {
      const btn = el('button', {
        class: 'option',
        on: { click: () => {
          state.answers[q.key] = opt.value;
          if (state.step + 1 < questions.length) {
            state.step++;
            render();
          } else {
            state.screen = 'loading';
            render();
            setTimeout(() => {
              state.results = computeResults();
              state.selectedId = state.results[0].id;
              state.screen = 'result';
              render();
            }, 1100);
          }
        }},
      },
        el('span', { class: 'icon', text: opt.icon }),
        el('span', { class: 'opt-text', text: opt.label },
          opt.sub ? el('span', { class: 'opt-sub', text: opt.sub }) : null,
        ),
      );
      opts.appendChild(btn);
    }
    c.appendChild(opts);

    const nav = el('div', { class: 'quiz-nav' });
    if (state.step > 0) {
      nav.appendChild(el('button', {
        class: 'ghost',
        text: '← 이전',
        on: { click: () => { state.step--; render(); } },
      }));
    } else {
      nav.appendChild(el('span'));
    }
    nav.appendChild(el('span', { class: 'footer-note', text: '한 번에 하나씩 선택하면 자동으로 넘어갑니다' }));
    c.appendChild(nav);
  }

  function renderLoading(c) {
    const wrap = el('div', { class: 'loading-wrap' });
    wrap.appendChild(el('div', { class: 'spinner' }));
    wrap.appendChild(el('div', { class: 'loading-text', text: '여행 성향 분석 중…' }));
    c.appendChild(wrap);
  }

  function renderResult(c) {
    const persona = buildPersona(state.answers);

    // Persona card
    const pCard = el('div', { class: 'persona-card' });
    pCard.appendChild(el('div', { class: 'persona-eyebrow', text: 'YOUR TRAVELER TYPE' }));
    pCard.appendChild(el('div', { class: 'persona-name', text: persona.name + ' 여행자' }));
    pCard.appendChild(el('div', { class: 'persona-desc', text: persona.desc }));
    c.appendChild(pCard);

    // Top 3
    c.appendChild(el('div', { class: 'section-title', text: '추천 여행지 TOP 3' }));
    const list = el('div', { class: 'dest-list' });
    state.results.forEach((d, i) => {
      const isActive = state.selectedId === d.id;
      const item = el('button', {
        class: 'dest-item' + (isActive ? ' active' : ''),
        on: { click: () => { state.selectedId = d.id; render(); } },
      });
      const head = el('div', { class: 'dest-head' });
      head.appendChild(el('span', { class: 'dest-rank' + (i === 1 ? ' r2' : i === 2 ? ' r3' : ''), text: String(i + 1) }));
      head.appendChild(el('span', { class: 'dest-emoji', text: d.emoji }));
      head.appendChild(el('span', { class: 'dest-name', text: d.name },
        el('span', { class: 'dest-score', text: `fit ${d.fit}%` }),
      ));
      head.appendChild(el('span', { class: 'dest-country', text: d.country }));
      item.appendChild(head);
      item.appendChild(el('div', { class: 'dest-reason', text: d.oneLineReason }));
      list.appendChild(item);
    });
    c.appendChild(list);

    // Detail of selected
    const selected = state.results.find(r => r.id === state.selectedId) || state.results[0];
    const detail = el('div', { class: 'detail-card' });
    const head = el('div', { class: 'detail-head' });
    head.appendChild(el('span', { class: 'dest-emoji', text: selected.emoji }));
    head.appendChild(el('span', { class: 'detail-name', text: selected.name }));
    head.appendChild(el('span', { class: 'detail-country', text: selected.country }));
    detail.appendChild(head);

    const tags = el('div', { class: 'detail-tags' });
    selected.tags.forEach(t => tags.appendChild(el('span', { class: 'tag', text: '# ' + t })));
    detail.appendChild(tags);

    function block(title, listItems, cls) {
      const b = el('div', { class: 'detail-block' + (cls ? ' ' + cls : '') });
      b.appendChild(el('h4', { text: title }));
      if (Array.isArray(listItems)) {
        const ul = el('ul');
        listItems.forEach(it => ul.appendChild(el('li', { text: it })));
        b.appendChild(ul);
      } else {
        b.appendChild(el('div', { class: 'budget', text: listItems }));
      }
      return b;
    }
    detail.appendChild(block('추천 코스', selected.course));
    detail.appendChild(block('예상 비용', selected.budgetEstimate));
    detail.appendChild(block('출국 전 준비물', selected.prep));
    detail.appendChild(block('현지 팁', selected.tips));
    c.appendChild(detail);

    // Actions
    const actions = el('div', { class: 'result-actions' });
    actions.appendChild(el('button', {
      class: 'ghost',
      text: '↻ 다시 진단',
      on: { click: () => { state.screen = 'welcome'; state.step = 0; state.answers = {}; state.results = []; state.selectedId = null; render(); } },
    }));
    actions.appendChild(el('button', {
      class: 'primary brand',
      text: '결과 공유하기',
      on: { click: async () => {
        const text = `[여행 처방전]\n유형: ${persona.name} 여행자\n추천 1순위: ${selected.emoji} ${selected.name} (${selected.country}) — fit ${selected.fit}%\n${selected.oneLineReason}\n${location.href}`;
        if (navigator.share) {
          try { await navigator.share({ title: '여행 처방전', text, url: location.href }); }
          catch (e) {}
        } else {
          try {
            await navigator.clipboard.writeText(text);
            alert('결과가 클립보드에 복사되었어요!');
          } catch (e) { alert('공유가 지원되지 않는 환경입니다.'); }
        }
      }},
    }));
    c.appendChild(actions);

    c.appendChild(el('p', { class: 'footer-note', text: '본 처방은 정적 데이터 기반의 추천이며, 항공·환율 등 실시간 정보는 별도 확인이 필요합니다.' }));
  }

  render();
</script>
